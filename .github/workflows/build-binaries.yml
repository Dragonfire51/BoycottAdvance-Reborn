name: build-binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p dist
          cp boycottadvance-reborn dist/boycottadvance-reborn-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/boycottadvance-reborn-linux-x86_64

  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [win32, win64]
        include:
          - arch: win32
            triplet: i686-w64-mingw32
          - arch: win64
            triplet: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 zip curl
      - name: Fetch SDL2 mingw devel
        run: |
          curl -sL -o /tmp/sdl2.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-devel-2.32.10-mingw.tar.gz
          tar xzf /tmp/sdl2.tar.gz -C /tmp
      - name: Build ${{ matrix.arch }}
        run: |
          T=${{ matrix.triplet }}
          S=/tmp/SDL2-2.32.10/$T
          mkdir -p build
          $T-windres -i src/icon.rc -o build/icon.res
          for f in gba mem arm ppu apu bios main; do
            $T-gcc -std=c99 -O2 -Wall -Isrc -I$S/include -c src/$f.c -o build/$f.o
          done
          $T-gcc build/*.o -L$S/lib -lmingw32 -lSDL2main -lSDL2 -lm -o build/boycottadvance-reborn.exe
          mkdir -p dist
          cp build/boycottadvance-reborn.exe dist/
          cp README.md gba_bios.bin dist/
          cp $S/bin/SDL2.dll dist/
      - name: Package zip
        working-directory: dist
        run: zip -X -r ../boycottadvance-reborn-${{ matrix.arch }}.zip README.md boycottadvance-reborn.exe SDL2.dll gba_bios.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: boycottadvance-reborn-${{ matrix.arch }}.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2 pkg-config
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p dist
          cp boycottadvance-reborn dist/boycottadvance-reborn-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/boycottadvance-reborn-macos

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Source tarball
        run: |
          P=boycottadvance-reborn-${GITHUB_REF_NAME}
          git archive --format=tar --prefix=$P/ HEAD src Makefile README.md .gitignore assets tools \
            | gzip -9 > boycottadvance-reborn-${GITHUB_REF_NAME}-src.tar.gz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boycottadvance-reborn-linux-x86_64
            boycottadvance-reborn-macos
            boycottadvance-reborn-win32.zip
            boycottadvance-reborn-win64.zip
            boycottadvance-reborn-*-src.tar.gz
          generate_release_notes: true
