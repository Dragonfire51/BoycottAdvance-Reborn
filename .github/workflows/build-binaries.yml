name: build-binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p dist
          cp boycottadvance-reborn dist/boycottadvance-reborn-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/boycottadvance-reborn-linux-x86_64

  windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [win32, win64]
        include:
          - arch: win32
            make_arch: ARCH=i686
            arch_name: i686
          - arch: win64
            make_arch: ARCH=x86_64
            arch_name: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 zip
      - name: Build ${{ matrix.arch }} (native, no SDL)
        run: |
          # The Windows build is SDL-free: native GDI/Direct3D 9 video,
          # WinMM (waveOut) audio and a full Win32 menu bar.
          make -f Makefile.win32 ${{ matrix.make_arch }}
          mkdir -p dist
          cp boycottadvance-reborn-${{ matrix.arch_name }}.exe dist/boycottadvance-reborn.exe
          cp README.md gba_bios.bin dist/
      - name: Package zip
        working-directory: dist
        run: zip -X -r ../boycottadvance-reborn-${{ matrix.arch }}.zip README.md boycottadvance-reborn.exe gba_bios.bin
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: boycottadvance-reborn-${{ matrix.arch }}.zip

  macos:
    runs-on: macos-latest
    # Homebrew on the macOS runner is slow enough to hit the default 6h
    # ceiling only in pathological cases, but a hung `brew install` used to
    # burn 15 minutes and then fail the whole run. Cap it so a stuck job
    # fails fast and the release below can still publish the other builds.
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2 pkg-config
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p dist
          cp boycottadvance-reborn dist/boycottadvance-reborn-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/boycottadvance-reborn-macos

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Source tarball
        run: |
          P=boycottadvance-reborn-${GITHUB_REF_NAME}
          git archive --format=tar --prefix=$P/ HEAD src Makefile Makefile.win32 README.md .gitignore assets tools \
            | gzip -9 > boycottadvance-reborn-${GITHUB_REF_NAME}-src.tar.gz
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boycottadvance-reborn-linux-x86_64
            boycottadvance-reborn-macos
            boycottadvance-reborn-win32.zip
            boycottadvance-reborn-win64.zip
            boycottadvance-reborn-*-src.tar.gz
          generate_release_notes: true
